databases:
  - name: taskapi-db
    plan: free
    databaseName: taskapi
    user: taskapi

services:
  - type: web
    name: fastapi-cicd-devops
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Task Management API
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskapi-db
          property: connectionString
