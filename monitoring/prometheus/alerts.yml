groups:
  - name: task-api
    rules:
      - alert: TaskApiDown
        expr: up{job=~"task-api.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Task API is down ({{ $labels.deployment }})"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 1 minute."

      - alert: TaskApiHighErrorRate
        expr: |
          sum by (deployment) (rate(http_requests_total{status=~"5.."}[1m]))
            /
          sum by (deployment) (rate(http_requests_total[1m]))
            > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing ({{ $labels.deployment }})"
          description: "{{ $value | humanizePercentage }} of requests returned a 5xx status over the last minute."

      - alert: TaskApiDatabaseUnreachable
        expr: sum by (deployment) (increase(http_requests_total{path="/health", status="503"}[1m])) > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API cannot reach PostgreSQL ({{ $labels.deployment }})"
          description: "/health has been returning 503 (database unreachable)."

      - alert: TaskApiSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le, deployment) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency above 500 ms ({{ $labels.deployment }})"
          description: "p95 latency is {{ $value | humanizeDuration }}."
