# Prometheus scrapes the API's /metrics endpoint and evaluates the alert rules.
# Open http://localhost:9090 -> Status > Targets, and Alerts.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API running in Docker Compose next to Prometheus.
  - job_name: task-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          deployment: local

  # The API deployed on Render. Add its hostname to targets/render.yml;
  # Prometheus picks the change up without a restart.
  - job_name: task-api-render
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 20s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/render.yml

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
