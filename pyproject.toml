[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "unit: fast tests with no database or HTTP server",
    "api: HTTP tests that call the API through FastAPI's TestClient",
    "db: tests that talk to the database layer directly",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# CI fails if test coverage drops below this percentage.
fail_under = 90
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle errors and warnings
    "F",       # pyflakes: unused imports, undefined names
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # simplifications
    "N",       # naming conventions
    "S",       # bandit: security issues
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fake passwords and subprocess on purpose.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
# Load generator: random choices are not security related; URLs come from the CLI.
"scripts/generate_traffic.py" = ["S310", "S311"]
